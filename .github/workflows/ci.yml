name: ANBE CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  portable-regression:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Compile ANBE
        run: |
          python -m compileall -q anbe tests

      - name: Run portable regression suite
        run: |
          python -m tests.run_ci
